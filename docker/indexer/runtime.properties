# Runs tasks as threads in this one process instead of forking a JVM per task
# as a MiddleManager does, which took ~8s of every small ingestion. Each
# SQL-based ingestion or deep storage query takes two slots (a controller and
# a worker), so integration tests that ingest concurrently need several.
druid.service=druid/indexer
druid.plaintextPort=8091
druid.worker.capacity=8
druid.worker.baseTaskDirs=[\"var/druid/task\"]
# Each running task also takes HTTP threads for its chat handler
druid.server.http.numThreads=40
druid.processing.numMergeBuffers=2
druid.processing.buffer.sizeBytes=50MiB
druid.processing.numThreads=2
