version: '2'
services:
  postgres:
    image: postgres:12.6
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=password
    ports:
      - '6432:5432'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgresdata:/var/lib/postgresql/data
    command: postgres -c listen_addresses='*'

  zookeeper:
    image: zookeeper:3.6
    restart: unless-stopped
    hostname: zookeeper
    ports:
      - "3181:2181"
    healthcheck:
      test: [ "CMD", "sh", "-c", "nc -nz 127.0.0.1 2181" ]
      interval: 5s
      timeout: 60s
      retries: 10
    environment:
      ZOO_MY_ID: 1
    volumes:
      - zkdata:/data
      - zkdatalog:/datalog

  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - 9900:8333
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz" ]
      interval: 10s
      timeout: 5s
      retries: 5
    hostname: seaweedfs
    volumes:
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - seaweedfsdata:/data

  # For the streaming ingestion tests. Only reachable inside the compose
  # network, as kafka:9092; the tests write to it with `docker compose exec`.
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  druid:
    build:
      context: docker
      dockerfile: druid.Dockerfile
    ports:
      - "9888:8888"
      - "9082:8082"
    healthcheck:
      test: [ "CMD", "curl", "-f", "localhost:8082/status/health" ]
      interval: 5s
      timeout: 5s
      retries: 3
    volumes:
      - .data/druid_data:/opt/druid/var/
    depends_on:
      - zookeeper
      - postgres
      - seaweedfs
      - kafka
    environment:
      AWS_REGION: us-east-1

volumes:
  seaweedfsdata:
  postgresdata:
  zkdata:
  zkdatalog:
